[package]
name = "feedfuse"
version = "0.6.0"
description = "FeedFuse desktop shell (Tauri v2)"
authors = ["FeedFuse"]
edition = "2021"
rust-version = "1.77"
publish = false

# 产出可执行名必须是 FeedFuse（bundle 内的可执行文件与 Info.plist 都依赖它）。
[[bin]]
name = "FeedFuse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 只用到 libc::kill 发 SIGTERM：std 的 Child::kill() 在 Unix 上固定是 SIGKILL，
# 拿不到优雅退出的机会，而为一个函数引入 nix 之类的大 crate 不值得。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
